<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookbookbook</title>
    <script type="module" crossorigin src="./assets/index-CyiUFZ1b.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DUrQh0OE.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel">
        <div class="title-row">
          <img class="brand-drawing" src="./bookbookbook.png" alt="책 위에 book book book 글자와 강아지가 그려진 Bookbookbook 그림">
        </div>

        <form data-form>
          <button class="drop-zone" type="button" data-drop-zone>
            <span class="drop-title">PDF 드롭 또는 선택</span>
            <span class="drop-file" data-file-name>아직 선택된 파일이 없습니다.</span>
          </button>
          <input data-file type="file" name="pdf" accept="application/pdf,.pdf" hidden>

          <fieldset class="options">
            <legend>제본 방향</legend>
            <label>
              <input type="radio" name="binding" value="left" checked>
              좌철
            </label>
            <label>
              <input type="radio" name="binding" value="right">
              우철
            </label>
          </fieldset>

          <button class="primary" type="submit" data-submit>중철 PDF 만들기</button>
        </form>

        <p class="status" data-status></p>
        <section class="result" data-result hidden></section>
        <p class="auto-blank-notice">중철 소책자는 전체 쪽수가 4의 배수여야 해서, 쪽수가 부족하면 뒤표지 앞에 빈 페이지가 자동으로 추가됩니다.</p>
      </section>

      <aside class="preview-panel" aria-label="PDF 미리보기">
        <div class="preview-header">
          <h2>PDF 미리보기</h2>
          <p data-preview-name>선택된 PDF가 없습니다.</p>
        </div>
        <div class="page-indicator" data-page-indicator hidden>1/1</div>
        <div class="preview-frame" data-preview-frame tabindex="0" aria-label="PDF 페이지 미리보기. 왼쪽을 누르면 이전 페이지, 오른쪽을 누르면 다음 페이지로 이동합니다.">
          <div class="preview-empty" data-preview-empty>PDF를 선택하면 여기에 표시됩니다.</div>
          <canvas data-preview-canvas aria-label="선택한 PDF 페이지 미리보기" hidden></canvas>
        </div>
      </aside>
    </main>
  </body>
</html>
